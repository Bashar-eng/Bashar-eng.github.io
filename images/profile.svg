<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Professional avatar of Bashar Ayman Elazony">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="330" cy="70" r="90" fill="#ffffff" opacity="0.07"/>
  <circle cx="60" cy="350" r="110" fill="#ffffff" opacity="0.06"/>

  <!-- Shoulders / jacket -->
  <path d="M40 400 C40 322 110 290 200 290 C290 290 360 322 360 400 Z" fill="#0b1f3a"/>
  <!-- Shirt collar -->
  <path d="M158 292 L200 350 L242 292 Q200 280 158 292 Z" fill="url(#shirt)"/>
  <!-- Tie -->
  <path d="M192 336 L208 336 L214 392 L200 400 L186 392 Z" fill="#0f766e"/>

  <!-- Neck -->
  <rect x="172" y="245" width="56" height="58" rx="18" fill="#d9a67e"/>
  <!-- Head -->
  <ellipse cx="200" cy="180" rx="72" ry="84" fill="#e8b98f"/>
  <!-- Ears -->
  <ellipse cx="128" cy="188" rx="10" ry="16" fill="#d9a67e"/>
  <ellipse cx="272" cy="188" rx="10" ry="16" fill="#d9a67e"/>
  <!-- Hair -->
  <path d="M126 168 C118 96 170 78 204 78 C246 78 286 100 274 168 C262 132 240 120 200 120 C160 120 140 134 126 168 Z" fill="#1f2937"/>

  <!-- Face -->
  <ellipse cx="172" cy="182" rx="6" ry="7" fill="#1f2937"/>
  <ellipse cx="228" cy="182" rx="6" ry="7" fill="#1f2937"/>
  <path d="M158 166 Q172 158 186 165" stroke="#1f2937" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M214 165 Q228 158 242 166" stroke="#1f2937" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M200 188 Q196 208 204 212" stroke="#c48d66" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M174 226 Q200 244 226 226" stroke="#8a4b3a" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
